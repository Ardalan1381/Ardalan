# Example Nginx vhost. Copy to /etc/nginx/sites-available/, adjust the
# marked lines for your server, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx`.
#
# This assumes:
#   - the app lives at /var/www/cafe (document root is its public/ folder —
#     never point server_name at the project root, only public/)
#   - PHP-FPM is already running (adjust the socket path for your PHP version)
#   - Reverb is running on 127.0.0.1:8080 (see deploy/systemd/cafe-reverb.service)
#   - TLS is terminated here or by a proxy in front of this — either way,
#     REVERB_SCHEME/APP_URL in .env must match what visitors actually see

server {
    listen 80;
    listen [::]:80;
    server_name example.com; # CHANGE ME

    root /var/www/cafe/public; # CHANGE ME (path only, keep the /public)
    index index.php;

    charset utf-8;
    client_max_body_size 20m; # product image uploads

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb's WebSocket endpoint — proxied on the same domain/port so it
    # rides along with your existing TLS certificate.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock; # CHANGE ME to your PHP-FPM socket
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Never serve dotfiles (.env, .git, etc.) even though they already sit
    # outside document root — defense in depth against a misconfigured root.
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/cafe-access.log;
    error_log /var/log/nginx/cafe-error.log;
}
