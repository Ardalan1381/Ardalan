# Alternative to the systemd units in deploy/systemd/ — use whichever
# process supervisor your server already runs. Same two processes either
# way: the queue worker and the Reverb WebSocket server.
#
# Install:
#   sudo cp deploy/supervisor/cafe.conf /etc/supervisor/conf.d/cafe.conf
#   sudo supervisorctl reread
#   sudo supervisorctl update
#
# Edit directory/user/command below to match your server first.

[program:cafe-queue]
process_name=%(program_name)s
command=/usr/bin/php /var/www/cafe/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/cafe
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/cafe/storage/logs/queue-worker.log
stopwaitsecs=3600

[program:cafe-reverb]
process_name=%(program_name)s
command=/usr/bin/php /var/www/cafe/artisan reverb:start
directory=/var/www/cafe
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/www/cafe/storage/logs/reverb.log
