name: CafeMenu

on:
  push:
    paths: ['CafeMenu/**', '.github/workflows/cafemenu.yml']
  pull_request:
    paths: ['CafeMenu/**', '.github/workflows/cafemenu.yml']

defaults:
  run:
    working-directory: CafeMenu

jobs:
  quality:
    name: Lint & static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Code style
        run: vendor/bin/pint --test
      - name: Dependency advisories
        run: composer audit --no-dev

  tests-sqlite:
    name: Tests (PHP ${{ matrix.php }}, SQLite)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CafeMenu/package-lock.json
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci && npm run build
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan app:ensure-reverb-credentials
      - run: php artisan test

  tests-mariadb:
    name: Tests + concurrency (MariaDB 10.11)
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: cafemenu_test
          MARIADB_USER: cafe
          MARIADB_PASSWORD: cafe
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cafemenu_test
      DB_USERNAME: cafe
      DB_PASSWORD: cafe
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CafeMenu/package-lock.json
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci && npm run build
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan app:ensure-reverb-credentials
      - name: Migrations apply and roll back cleanly
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan migrate:fresh --force
      - name: Feature, unit and multi-process concurrency tests
        run: php artisan test
